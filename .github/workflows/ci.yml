name: CI (validação)

# Validação automática e barata em cada push/PR: restaura dependências,
# compila (valida a semântica do código) e roda os testes. NÃO gera binários
# de release — isso fica no workflow de deploy, acionado manualmente/por tag.

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar dependências, compilação e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar SDK do .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 1) Dependências: 'restore' falha se algum pacote não resolver.
      - name: Restaurar dependências
        run: dotnet restore RedeScan.sln

      # 2) Semântica: compila em Release tratando avisos como erro.
      - name: Compilar (Release, avisos como erro)
        run: dotnet build RedeScan.sln --configuration Release --no-restore -warnaserror

      # 3) Testes automatizados.
      - name: Executar testes
        run: dotnet test RedeScan.sln --configuration Release --no-build --verbosity normal

  # Valida o script do instalador Windows (Inno Setup) a cada mudança.
  # Roda no runner Windows, onde o iscc já vem instalado — o mesmo ambiente do
  # release. (Rodar via Wine em container falha no runner Ubuntu 26.04:
  # "wineserver: socket: Function not implemented".)
  validate-windows-installer:
    name: Validar instalador Windows (Inno Setup)
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Compilar o .iss com uma pasta publicada fictícia
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path full\win-x64 | Out-Null
          Set-Content -Path full\win-x64\RedeScan.exe -Value placeholder
          $pub = (Resolve-Path "full\win-x64").Path
          iscc /DPublishDir="$pub" /DAppVersion="0.0.0" scripts\packaging\redescan.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
