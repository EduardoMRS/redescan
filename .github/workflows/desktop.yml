name: Build and Deploy (Windows, Linux & Android)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]          # uma tag v* (ex.: v1.0.0) dispara a publicação da Release
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Necessário para o job de release criar/atualizar a GitHub Release.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Desktop: compila, testa e publica o executável self-contained por plataforma.
  # ---------------------------------------------------------------------------
  build-test-publish:
    name: Build & Publish (${{ matrix.target.rid }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: RedeScan-Linux-x64
          - os: windows-latest
            rid: win-x64
            artifact_name: RedeScan-Windows-x64

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar SDK do .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore RedeScan.sln

      - name: Compilar solução
        run: dotnet build RedeScan.sln --configuration Release --no-restore

      - name: Executar testes automatizados
        run: dotnet test RedeScan.sln --configuration Release --no-build --verbosity normal

      - name: Publicar aplicação desktop
        run: >
          dotnet publish src/RedeScan.Desktop/RedeScan.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.target.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output ./publish/${{ matrix.target.rid }}

      # Empacota o binário em um único arquivo (zip) para anexar à Release.
      - name: Compactar artefato (Linux)
        if: runner.os == 'Linux'
        run: |
          cd ./publish/${{ matrix.target.rid }}
          zip -r "../../${{ matrix.target.artifact_name }}.zip" .

      - name: Compactar artefato (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path ./publish/${{ matrix.target.rid }}/* -DestinationPath ./${{ matrix.target.artifact_name }}.zip

      - name: Armazenar artefato da execução
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact_name }}
          path: ./${{ matrix.target.artifact_name }}.zip

  # ---------------------------------------------------------------------------
  # Android: gera o APK de teste (debug-signed).
  # ---------------------------------------------------------------------------
  build-android-apk:
    name: Gerar APK (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar SDK do .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # O global.json fixa o SDK na banda 8.0.4xx, então o workload resolve o
      # manifesto android do .NET 8 (e não o do .NET 10 pré-instalado no runner),
      # evitando o "Disk quota exceeded" ao baixar packs net9/net10.
      - name: Instalar workload android (.NET 8)
        run: dotnet workload install android --skip-manifest-update

      - name: Publicar APK (Release)
        run: >
          dotnet publish src/RedeScan.Android/RedeScan.Android.csproj
          --configuration Release
          --output ./dist/android

      - name: Renomear APK para nome estável
        run: cp ./dist/android/*-Signed.apk ./RedeScan-Android.apk

      - name: Armazenar APK da execução
        uses: actions/upload-artifact@v4
        with:
          name: RedeScan-Android-APK
          path: ./RedeScan-Android.apk

  # ---------------------------------------------------------------------------
  # Validação (não bloqueante) da build de mídia nativa (CEF + LibVLC).
  # ---------------------------------------------------------------------------
  build-native-media:
    name: Validar build com mídia nativa
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar SDK do .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar libvlc
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev vlc

      - name: Compilar com EnableNativeMedia=true
        run: >
          dotnet build src/RedeScan.Desktop/RedeScan.Desktop.csproj
          --configuration Release
          -p:EnableNativeMedia=true

  # ---------------------------------------------------------------------------
  # DEPLOY / PUBLICAÇÃO: só roda quando uma tag v* é enviada.
  # Baixa os artefatos dos jobs acima e cria uma GitHub Release com eles.
  # ---------------------------------------------------------------------------
  release:
    name: Publicar GitHub Release
    needs: [ build-test-publish, build-android-apk ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Listar artefatos baixados
        run: find ./artifacts -type f

      - name: Criar/atualizar a Release com os binários
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./artifacts/**/*.zip
            ./artifacts/**/*.apk
