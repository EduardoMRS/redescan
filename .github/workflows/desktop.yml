name: Build and Deploy (Windows & Linux)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-test-publish:
    name: Build & Publish (${{ matrix.target.rid }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: RedeScan-Linux-x64
          - os: windows-latest
            rid: win-x64
            artifact_name: RedeScan-Windows-x64

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar SDK do .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore RedeScan.sln

      - name: Compilar solução
        run: dotnet build RedeScan.sln --configuration Release --no-restore

      - name: Executar testes automatizados
        run: dotnet test RedeScan.sln --configuration Release --no-build --verbosity normal

      - name: Publicar aplicação desktop
        run: >
          dotnet publish src/RedeScan.Desktop/RedeScan.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.target.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output ./publish/${{ matrix.target.rid }}

      - name: Armazenar artefatos gerados
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact_name }}
          path: ./publish/${{ matrix.target.rid }}

  # Build de distribuição com mídia nativa (navegador CEF + vídeo LibVLC).
  # NÃO é single-file (o CEF exige arquivos soltos). Publica uma pasta
  # autocontida por plataforma. Não bloqueia os artefatos principais.
  package-native-media:
    name: Empacotar mídia nativa (${{ matrix.target.rid }})
    runs-on: ${{ matrix.target.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: RedeScan-Native-Linux-x64
          - os: windows-latest
            rid: win-x64
            artifact_name: RedeScan-Native-Windows-x64

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar SDK do .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # No Linux, o libvlc é dependência do sistema (não existe no NuGet).
      - name: Instalar libvlc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev vlc

      - name: Publicar build de mídia nativa
        run: >
          dotnet publish src/RedeScan.Desktop/RedeScan.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.target.rid }}
          --self-contained true
          -p:EnableNativeMedia=true
          -p:PublishSingleFile=false
          --output ./dist/native/${{ matrix.target.rid }}

      - name: Armazenar pacote de mídia nativa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact_name }}
          path: ./dist/native/${{ matrix.target.rid }}

  # Gera um APK de teste do Android (debug-signed). Projeto fora da RedeScan.sln
  # para não exigir o workload android no build principal.
  build-android-apk:
    name: Gerar APK de teste (Android)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar SDK do .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar workload android
        run: dotnet workload install android

      - name: Publicar APK (Release)
        run: >
          dotnet publish src/RedeScan.Android/RedeScan.Android.csproj
          --configuration Release
          --output ./dist/android

      - name: Armazenar APK
        uses: actions/upload-artifact@v4
        with:
          name: RedeScan-Android-APK
          path: ./dist/android/*-Signed.apk
