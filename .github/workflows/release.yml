name: Release (deploy manual)

# Deploy acionado MANUALMENTE (workflow_dispatch) ou ao enviar uma tag v*.
# Gera as variantes Portátil (leve) e Full (com motor web + vídeo) para
# Windows, Linux (Ubuntu e Fedora) e o APK Android, e publica a GitHub Release.
#
# A validação (dependências/compilação/testes) fica no workflow "CI (validação)".

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/versão da release (ex.: v1.0.0). Se vazio, publica como pré-release de teste."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ===========================================================================
  # VERSÃO: resolve a tag (ex.: v1.0.0) e o número puro (1.0.0) para os pacotes.
  # ===========================================================================
  version:
    name: Resolver versão
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      number: ${{ steps.v.outputs.number }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"; PRE="false"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"; PRE="false"
          else
            TAG="manual-$(date +%Y%m%d-%H%M%S)"; PRE="true"
          fi
          NUM="$(echo "$TAG" | sed 's/^v//')"
          # Pacotes (MSI/deb/rpm) exigem número x.y.z; usa 0.0.0 em build de teste.
          case "$NUM" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) NUM="0.0.0" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Resolvido: tag=$TAG number=$NUM prerelease=$PRE"

  # ===========================================================================
  # PORTÁTIL (leve): executável único por plataforma, sem motor web embutido.
  # ===========================================================================
  portable-desktop:
    name: Portátil (${{ matrix.target.rid }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: RedeScan-Portable-Linux
          - os: windows-latest
            rid: win-x64
            artifact_name: RedeScan-Portable-Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar executável self-contained (sem .pdb)
        run: >
          dotnet publish src/RedeScan.Desktop/RedeScan.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.target.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output ./publish/${{ matrix.target.rid }}

      - name: Preparar binário (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item ./publish/${{ matrix.target.rid }}/RedeScan.exe ./RedeScan-Windows-x64.exe

      - name: Gerar AppImage (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/make-appimage.sh ./publish/${{ matrix.target.rid }}/RedeScan RedeScan-Linux-x86_64.AppImage

      - name: Armazenar artefato portátil
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact_name }}
          path: |
            ./RedeScan-Windows-x64.exe
            ./RedeScan-Linux-x86_64.AppImage
          if-no-files-found: ignore

  # ===========================================================================
  # FULL (motor web CEF + vídeo LibVLC): instaladores nativos por plataforma —
  # setup.exe (Inno Setup) no Windows, .deb no Ubuntu/Debian, .rpm no Fedora/RHEL.
  # ===========================================================================
  full-windows:
    name: Full — Windows (setup.exe)
    needs: version
    runs-on: windows-latest
    # Não bloqueia a release: se o instalador falhar, o portátil .exe cobre o Windows.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publicar pacote Full (CEF + LibVLC)
        run: >
          dotnet publish src/RedeScan.Desktop/RedeScan.Desktop.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:EnableNativeMedia=true -p:PublishSingleFile=false
          -p:DebugType=none -p:DebugSymbols=false
          --output ./full/win-x64
      # Instalador via Inno Setup (iscc já vem pré-instalado no runner Windows).
      # Inclui a pasta inteira com uma linha (recursesubdirs) — sem o atrito de
      # harvesting do WiX. Gera RedeScan-Full-Windows-x64.exe.
      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          # Caminho absoluto evita ambiguidade (Inno resolve Source relativo ao .iss).
          $pub = (Resolve-Path "full\win-x64").Path
          iscc /DPublishDir="$pub" `
               /DAppVersion="${{ needs.version.outputs.number }}" `
               scripts\packaging\redescan.iss
          Copy-Item scripts\packaging\RedeScan-Full-Windows-x64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: RedeScan-Full-Windows
          path: ./RedeScan-Full-Windows-x64.exe

  full-ubuntu:
    name: Full — Linux (.deb)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Instalar libvlc (apt)
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev vlc
      - name: Publicar pacote Full (CEF + LibVLC)
        run: >
          dotnet publish src/RedeScan.Desktop/RedeScan.Desktop.csproj
          --configuration Release --runtime linux-x64 --self-contained true
          -p:EnableNativeMedia=true -p:PublishSingleFile=false
          -p:DebugType=none -p:DebugSymbols=false
          --output ./full/linux-x64
      - name: Gerar instalador .deb
        run: bash scripts/packaging/build-deb.sh ./full/linux-x64 "${{ needs.version.outputs.number }}" RedeScan-Full-Linux-x64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: RedeScan-Full-Linux-Ubuntu
          path: ./RedeScan-Full-Linux-x64.deb

  full-fedora:
    name: Full — Linux (.rpm)
    needs: version
    runs-on: ubuntu-latest
    container: fedora:40
    # Não bloqueia a release: se o Fedora falhar, os demais pacotes saem mesmo assim.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # libvlc + utilitários + rpm-build via dnf. O SDK do .NET vem SEMPRE do
      # script oficial: o pacote dnf é da banda 8.0.1xx, que não satisfaz o
      # global.json (8.0.4xx). O script respeita o global.json.
      - name: Instalar dependências (dnf)
        run: dnf -y install vlc-devel vlc-libs rpm-build findutils libicu krb5-libs tar which curl
      - name: Instalar .NET 8 SDK (script oficial, banda 8.0.4xx)
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir /usr/lib/dotnet
          ln -sf /usr/lib/dotnet/dotnet /usr/bin/dotnet
          dotnet --info
      - name: Publicar pacote Full (CEF + LibVLC)
        env:
          DOTNET_ROOT: /usr/lib/dotnet
        run: >
          /usr/lib/dotnet/dotnet publish src/RedeScan.Desktop/RedeScan.Desktop.csproj
          --configuration Release --runtime linux-x64 --self-contained true
          -p:EnableNativeMedia=true -p:PublishSingleFile=false
          -p:DebugType=none -p:DebugSymbols=false
          --output ./full/fedora-x64
      - name: Gerar instalador .rpm
        run: bash scripts/packaging/build-rpm.sh ./full/fedora-x64 "${{ needs.version.outputs.number }}" RedeScan-Full-Linux-x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: RedeScan-Full-Linux-Fedora
          path: ./RedeScan-Full-Linux-x86_64.rpm

  # ===========================================================================
  # ANDROID: APK (debug-signed). O navegador no Android usa "abrir no sistema"
  # (o WebView nativo embutido é item futuro; o CEF é desktop-only).
  # ===========================================================================
  android-apk:
    name: APK (Android)
    runs-on: ubuntu-latest
    # Não bloqueia a release: se o workload android falhar (rede), o resto sai.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # O download dos packs do workload pode falhar por rede transitória no
      # runner; tenta até 3 vezes antes de desistir.
      - name: Instalar workload android (.NET 8)
        run: |
          for i in 1 2 3; do
            echo "Tentativa $i de instalar o workload android…"
            if dotnet workload install android --skip-manifest-update --disable-parallel; then
              exit 0
            fi
            echo "Falhou (provável rede). Aguardando antes de tentar de novo…"
            sleep 15
          done
          echo "Workload android falhou após 3 tentativas." >&2
          exit 1
      - name: Publicar APK
        run: dotnet publish src/RedeScan.Android/RedeScan.Android.csproj --configuration Release --output ./dist/android
      - name: Renomear APK
        run: cp ./dist/android/*-Signed.apk ./RedeScan-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RedeScan-Android-APK
          path: ./RedeScan-Android.apk

  # ===========================================================================
  # PUBLICAÇÃO: junta todos os artefatos e cria a GitHub Release.
  # Em tag v*, usa a tag. Em disparo manual, usa o input (ou pré-release de teste).
  # ===========================================================================
  publish:
    name: Publicar GitHub Release
    needs: [ version, portable-desktop, full-windows, full-ubuntu, full-fedora, android-apk ]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Listar artefatos
        run: find ./artifacts -type f

      # Gera o manifesto latest.json com a versão e os links de download desta
      # release. Os assets ficam em /releases/download/<tag>/<arquivo>.
      - name: Gerar latest.json
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VER="${{ needs.version.outputs.number }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          cat > latest.json <<EOF
          {
            "version": "${VER}",
            "published": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mandatory": false,
            "notes": "Release ${TAG}",
            "downloads": {
              "windows": "${BASE}/RedeScan-Windows-x64.exe",
              "windowsFull": "${BASE}/RedeScan-Full-Windows-x64.exe",
              "linux": "${BASE}/RedeScan-Linux-x86_64.AppImage",
              "linuxFullUbuntu": "${BASE}/RedeScan-Full-Linux-x64.deb",
              "linuxFullFedora": "${BASE}/RedeScan-Full-Linux-x86_64.rpm",
              "android": "${BASE}/RedeScan-Android.apk"
            }
          }
          EOF
          echo "=== latest.json ===" && cat latest.json

      - name: Criar/atualizar a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            ./artifacts/**/*.exe
            ./artifacts/**/*.AppImage
            ./artifacts/**/*.apk
            ./artifacts/**/*.deb
            ./artifacts/**/*.rpm
            ./latest.json

      # Disponibiliza o latest.json como artefato do workflow para você subir ao
      # seu site (https://deveduardomrs.pro/d/redescan/release/latest.json).
      - name: Publicar latest.json como artefato
        uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: ./latest.json
